<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Finance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="navbar">
        <h1>⚡ Aviral Finance Dashboard</h1>
        <div class="nav-right">
            <span id="current-month"></span>
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <button class="export-btn" onclick="exportPDF()">📤 Export PDF</button>
        </div>
    </div>

    <div class="container">

        <div class="cards">
            <div class="card"><h3>Total Income</h3><div class="amount blue" id="inc">₹0</div></div>
            <div class="card"><h3>Total Expense</h3><div class="amount red" id="exp">₹0</div></div>
            <div class="card"><h3>Remaining</h3><div class="amount green" id="rem">₹0</div></div>
            <div class="card"><h3>Savings</h3><div class="amount yellow" id="sav">₹0</div></div>
        </div>

        <div class="top-grid">

            <div class="box">
                <h2>💰 Monthly Income</h2>
                <div class="row">
                    <input type="number" id="income-input" placeholder="Enter income (₹)" />
                    <input type="number" id="savings-input" placeholder="Savings amount (₹)" />
                    <button onclick="setIncome()">Set</button>
                </div>
                <p id="income-display" class="sub-text"></p>
            </div>

            <div class="box">
                <h2>🗂️ Add Category</h2>
                <div class="row">
                    <input type="text" id="cat-name" placeholder="e.g. Rent, Food, Netflix" />
                    <input type="number" id="cat-budget" placeholder="Budget (₹)" />
                    <button onclick="addCategory()">+ Add</button>
                </div>
            </div>

        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">

            <div class="box">
                <h2>📝 Add Transaction</h2>
                <div class="row">
                    <input type="text" id="t-desc" placeholder="Description (optional)" />
                    <input type="number" id="t-amount" placeholder="Amount (₹)" />
                    <select id="t-cat"><option value="">Select Category</option></select>
                    <button onclick="addTransaction()">+ Add</button>
                </div>

                <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="color:#888; font-size:13px">🎯 Savings Goal</span>
                        <span id="goal-display" style="color:#00ff88; font-size:13px; font-weight:bold"></span>
                    </div>
                    <div style="background:#1a1a1a; border-radius:20px; height:8px; overflow:hidden;">
                        <div id="goal-bar" style="height:100%; background:#00ff88; border-radius:20px; transition:width 0.4s ease; width:0%"></div>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:12px;">
                        <input type="number" id="goal-input" placeholder="Set savings goal (₹)" style="flex:1; padding:8px; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff; font-size:13px;" />
                        <button onclick="setGoal()" style="background:#00ff88; color:#000; padding:8px 16px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Set</button>
                    </div>
                </div>
            </div>

            <div class="box">
                <h2>🏆 Financial Health Score</h2>
                <div id="health-score"></div>
            </div>

        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
            <div class="box">
                <h2>📊 Budget vs Spent</h2>
                <canvas id="barChart" height="160"></canvas>
            </div>
            <div class="box">
                <h2>💡 Quick Insights</h2>
                <div id="insights"></div>
            </div>
        </div>

        <div class="cat-blocks" id="cat-blocks"></div>

        <div class="box" style="margin-bottom:24px">
            <h2>📋 Current Month Transactions</h2>
            <div id="current-history"></div>
        </div>

        <div class="box">
            <h2>🗓️ Monthly History</h2>
            <div id="history"></div>
        </div>

    </div>

    <script src="js/calculator.js"></script>
</body>
</html>
